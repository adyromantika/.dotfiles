- defaults:
    link:
      relink: true

- clean: ['~']

- shell:
  - command: git submodule update --init --recursive
    description: Installing submodules
    stdout: false
    stderr: true

  - command: scripts/install.sh
    description: Installing software
    stdout: false
    stderr: true

  - command: command -v bat >/dev/null 2>&1 && [ -d $(bat --config-dir) ] && scripts/bat.sh
    description: Installing bat themes
    stdout: false
    stderr: true

- create:
    ~/.config/mise/conf.d:
      mode: 0755

- link:
    ~/.aws/cli/alias:
      create: true
      path: config/.aws/cli/alias
      if: command -v aws
    ~/.gitignore: config/.gitignore
    ~/.tmux.conf:
      create: true
      path: config/.tmux.conf
      if: command -v tmux
    ~/.vimrc: config/.vim/.vimrc
    ~/.vim: config/.vim
    ~/.p10k.zsh: config/.p10k.zsh
    ~/.zshrc: config/.zshrc
    ~/.hushlogin: config/.hushlogin
    ~/.config/bat/config:
      create: true
      path: config/.config/bat/config
      if: command -v bat
    ~/.config/mise/conf.d/default.toml: # generic
      create: true
      path: config/.config/mise/conf.d/.mise.default.toml
      if: command -v mise
    ~/.config/mise/conf.d/legacy.toml: # machine-specific
      create: true
      path: config/.config/mise/conf.d/.mise.legacy.toml
      if: command -v mise && [ -f ~/.legacy ]
    ~/.config/mise/conf.d/s5.toml: # machine-specific
      create: true
      path: config/.config/mise/conf.d/.mise.s5.toml
      if: command -v mise && [ -f ~/.s5 ]
    ~/.config/mise/conf.d/w.toml: # machine-specific
      create: true
      path: config/.config/mise/conf.d/.mise.w.toml
      if: command -v mise && [ -f ~/.w ]


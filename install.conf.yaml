- defaults:
    link:
      relink: true

- clean: ['~']

- shell:
  - command: git submodule update --init --recursive
    description: Installing submodules
    stdout: false
    stderr: true

  - command: scripts/install.sh
    description: Installing software
    stdout: false
    stderr: true

  - command: command -v bat >/dev/null 2>&1 && [ -d $(bat --config-dir) ] && scripts/bat.sh
    description: Installing bat themes
    stdout: false
    stderr: true

- link:
    ~/.aws/cli/alias:
      create: true
      path: config/.aws/cli/alias
      if: command -v aws
    ~/.gitignore: config/.gitignore
    ~/.tmux.conf:
      create: true
      path: config/.tmux.conf
      if: command -v tmux
    ~/.vimrc: config/.vim/.vimrc
    ~/.vim: config/.vim
    ~/.p10k.zsh: config/.p10k.zsh
    ~/.zshrc: config/.zshrc
    ~/.hushlogin: config/.hushlogin
    ~/.config/bat/config:
      create: true
      path: config/.config/bat/config
      if: command -v bat
    ~/.config/mise/config.toml:
      create: true
      path: config/.mise.toml
      if: command -v mise
